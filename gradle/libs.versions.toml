[versions]
agp = "9.2.1"
kotlin = "2.4.10"

# Module identity
appVersionName = "0.1.0"
appVersionCode = "1"

androidxCore = "1.19.0"
coroutines = "1.11.0"
serialization = "1.11.0"
xposed = "82"
libxposed = "102.0.0"

compileSdk = "37"
targetSdk = "37"
minSdk = "26"
minSdkApi = "21"

# Bytecode targets; the toolchain itself is JDK 25
jvmToolchain = "25"
appJvmTarget = "21"
apiJvmTarget = "17"
# Kotlin level of the :api module (metadata + stdlib dependency)
apiKotlinLanguage = "2.2"
apiKotlinStdlib = "2.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
